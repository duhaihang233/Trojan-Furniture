name: iOS demo (simulator screenshots + video)

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick and boot an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 \(" | grep -oE '[0-9A-F-]{36}')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

      - name: Build
        run: |
          xcodebuild build -project ios/TroShare.xcodeproj -scheme TroShare -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Install, open each screen, capture
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/TroShare.app
          BUNDLE=edu.usc.troshare
          mkdir -p demo
          xcrun simctl install "$DEVICE" "$APP"
          # Warm-up launch so the first screenshot isn't a cold start.
          xcrun simctl launch "$DEVICE" "$BUNDLE"; sleep 8; xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force demo/troshare-demo.mp4 &
          REC=$!
          sleep 2
          for s in home map product checkout chat inbox browse sell account listings; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE" -demoScreen "$s"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "demo/$s.png"
          done
          kill -INT $REC; wait $REC || true
          ls -la demo

      - uses: actions/upload-artifact@v4
        with:
          name: troshare-demo
          path: demo/
