name: iOS demo (simulator screenshots + video)

on:
  workflow_dispatch:
  push:
    branches: [ios-app]
    paths: ["ios/**", ".github/workflows/ios-demo.yml"]

jobs:
  demo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick and boot an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 \(" | grep -oE '[0-9A-F-]{36}')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

      - name: Build
        run: |
          xcodebuild build -project ios/TroShare.xcodeproj -scheme TroShare -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Install, open each screen, capture
        env:
          # Optional. When the repo has this secret, the demo runs a real room analysis with Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/TroShare.app
          BUNDLE=edu.usc.troshare
          mkdir -p demo
          xcrun simctl install "$DEVICE" "$APP"
          # Sample room photo: "Endicott College Stoneridge Hall empty dorm room" by Sdkb,
          # Wikimedia Commons, CC BY-SA 4.0. Downloaded at run time, not stored in the repo.
          curl -sSL -A "TroShareDemo/1.0 (GitHub Actions)" -o /tmp/demo-room.jpg             "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Endicott_College_Stoneridge_Hall_empty_dorm_room.jpg/1280px-Endicott_College_Stoneridge_Hall_empty_dorm_room.jpg"
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          mkdir -p "$DATA/Documents"
          cp /tmp/demo-room.jpg "$DATA/Documents/demo-room.jpg"
          # Warm-up launch so the first screenshot isn't a cold start.
          xcrun simctl launch "$DEVICE" "$BUNDLE"; sleep 8; xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force demo/troshare-demo.mp4 &
          REC=$!
          sleep 2
          for s in home map product checkout chat inbox browse sell account listings room roomfit roomfit-lamp; do
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE" -demoScreen "$s"
            sleep 7
            xcrun simctl io "$DEVICE" screenshot "demo/$s.png"
          done
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
            SIMCTL_CHILD_ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" xcrun simctl launch "$DEVICE" "$BUNDLE" -demoScreen roomresults
            sleep 90
            xcrun simctl io "$DEVICE" screenshot demo/roomresults.png
          else
            echo "No ANTHROPIC_API_KEY secret; skipping the live room analysis."
          fi
          kill -INT $REC; wait $REC || true
          ls -la demo

      - uses: actions/upload-artifact@v4
        with:
          name: troshare-demo
          path: demo/
