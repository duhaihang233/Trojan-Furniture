# TroShare server: USC sign-in, student data (D1 + KV), and the Claude-powered room planner.
# The Anthropic API key is a Worker secret (set with `npx wrangler secret put ANTHROPIC_API_KEY`),
# never stored in this repository.
name = "troshare-room-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

# Per-student limits: 5 room analyses and 5 new listings per minute (separate counters).
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Chat messages: 30 per minute per student.
[[unsafe.bindings]]
name = "MSG_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Profiles saved before the D1 database existed; read once to copy them into D1 (see ensureUser).
[[kv_namespaces]]
binding = "PROFILES"
id = "a74088a0fd804e178d61049d588f7135"

# Listing photos (JPEG bytes), keyed by random photo IDs.
[[kv_namespaces]]
binding = "PHOTOS"
id = "8babd522bbe04c0ca3563064940be516"

# Students, listings and favorites. Tables are in schema.sql:
#   npx wrangler d1 execute troshare-db --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "troshare-db"
database_id = "95d4037c-ff86-43ef-98c7-9cc53b552942"

# Background AR model generation (class ArJobs in worker.js); one object per listing.
[[durable_objects.bindings]]
name = "AR_JOBS"
class_name = "ArJobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArJobs"]

[vars]
# Public OAuth client ID from Google Cloud Console; must match googleClientId in ../config.js.
GOOGLE_CLIENT_ID = "53504650186-br07fmrs9d8apcmd502ttnd4lkjv6cua.apps.googleusercontent.com"
# SESSION_SECRET (signs TroShare login tokens) is a Worker secret: npx wrangler secret put SESSION_SECRET
# Web Push (push.js): the public half of TroShare's VAPID key; must match vapidPublicKey in ../config.js.
# The private half is a Worker secret: VAPID_PRIVATE_JWK (the key as a JWK).
VAPID_PUBLIC_KEY = "BKPuBG6sP-Q0nBVDgUqUxR5qZ1-9lUz3JnBgFtbSDkcR1V6H5EE0CMVzS6sZizDzzFu6VmW92jdapBm568f9FQw"
VAPID_SUBJECT = "https://duhaihang233.github.io/Trojan-Furniture/"
# Guest demo login for the hackathon: "on" lets visitors try TroShare without a USC account (browse, and
# walk through listing an item up to Publish). Set to "off" and deploy to turn it off.
GUEST_DEMO = "on"

# Every day at 17:00 UTC (9 or 10 am in Los Angeles): return reminders (orders.js remindReturns).
[triggers]
crons = ["0 17 * * *"]
