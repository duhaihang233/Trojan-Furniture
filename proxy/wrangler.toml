# Cloudflare Worker that calls Claude for the TroShare "AI Room" feature.
# The Anthropic API key is a Worker secret (set with `npx wrangler secret put ANTHROPIC_API_KEY`),
# never stored in this repository.
name = "troshare-room-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

# Per-visitor limit: 5 analyses per minute per IP address.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
